<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CS2 Аукцион</title>

    <!-- Telegram WebView'ning ichki keshiga qarshi —
         bu meta teglar HTTP sarlavhalaridan ham oldinroq ishlaydi -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Telegram Mini App SDK — Telegram.WebApp global obyektini beradi -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Telegram WebView keshiga qarshi: har build'da yangi timestamp
         localStorage orqali versiyani solishtiradi va eski kesh topilsa reload qiladi -->
    <script>
      (function () {
        var v = '__BUILD_TS__';
        var s = localStorage.getItem('__app_v__');
        if (s !== v) {
          localStorage.setItem('__app_v__', v);
          if (s !== null) location.reload(true);
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-base-bg">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
